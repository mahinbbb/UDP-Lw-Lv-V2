<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Live Accounts & EXP Monitor | MAHIN MODZ</title><style>
:root{--blue:#1769e8;--blue2:#0d4fbf;--ink:#10243d;--muted:#728196;--line:#e5ebf3;--soft:#f4f8ff;--green:#11966a;--red:#d94b55;--shadow:0 18px 55px rgba(24,61,105,.08)}*{box-sizing:border-box}body{margin:0;background:#f6f9fd;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(1400px,calc(100% - 40px));margin:auto;padding:22px 0 40px}.nav{height:68px;background:#fff;border:1px solid var(--line);border-radius:18px;display:flex;align-items:center;justify-content:space-between;padding:9px 12px 9px 17px;box-shadow:0 8px 28px rgba(20,55,95,.05);position:sticky;top:14px;z-index:5}.brand{display:flex;align-items:center;gap:11px}.logo{width:40px;height:40px;border-radius:12px;background:#edf5ff;display:grid;place-items:center;color:var(--blue)}.logo svg{width:21px}.brand b{font-size:15px}.brand small{display:block;color:#8a97a8;font-size:9px;margin-top:2px}.nav-actions{display:flex;gap:7px}.btn{height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#52677e;padding:0 12px;display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:800;cursor:pointer}.btn svg{width:15px}.btn:hover{border-color:#bcd1ea;color:var(--blue);background:#f8fbff}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.hero{padding:34px 2px 18px}.eyebrow{font-size:9px;letter-spacing:1.2px;color:var(--blue);font-weight:900;text-transform:uppercase}.hero h1{font-size:30px;letter-spacing:-1px;margin:7px 0 6px}.hero p{font-size:11px;color:var(--muted);margin:0}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.toolbar h2{font-size:14px;margin:0}.toolbar span{font-size:9px;color:#8492a4}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:var(--shadow);cursor:pointer;transition:.18s}.card:hover{transform:translateY(-2px);border-color:#c9dbef;box-shadow:0 22px 55px rgba(24,61,105,.11)}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.profile{display:flex;gap:10px;min-width:0}.avatar{width:40px;height:40px;border-radius:11px;background:var(--soft);display:grid;place-items:center;color:var(--blue);flex:none}.avatar svg{width:18px}.name{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.uid{font:9px ui-monospace,SFMono-Regular,monospace;color:#8b98a8;margin-top:4px}.badge{font-size:8px;border:1px solid #d7e5f6;background:#f2f7fd;color:#4772a4;border-radius:5px;padding:3px 5px;margin-left:4px}.status{display:inline-flex;align-items:center;gap:7px;font-size:8px;font-weight:900;border-radius:999px;padding:6px 9px;white-space:nowrap;border:1px solid transparent;transition:all .25s ease}.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;position:relative;flex:none}.status-dot:after{content:"";position:absolute;inset:-4px;border-radius:50%;opacity:.75}.online{color:#087a52;background:#effbf6;border-color:#cdeee1}.online .status-dot{background:#18b77b;box-shadow:0 0 0 2px rgba(24,183,123,.14),0 0 14px rgba(24,183,123,.75);animation:livePulse 1.5s ease-in-out infinite}.online .status-dot:after{border:1px solid rgba(24,183,123,.45);animation:ringPulse 1.5s ease-out infinite}.match{color:var(--blue);background:#eef5ff;border-color:#d8e7fb}.match .status-dot{background:#2b7df0;box-shadow:0 0 0 2px rgba(43,125,240,.14),0 0 14px rgba(43,125,240,.65);animation:livePulse 1.4s ease-in-out infinite}.offline{color:#c73743;background:#fff1f2;border-color:#ffd7db}.offline .status-dot{background:#ef4d58;box-shadow:0 0 0 2px rgba(239,77,88,.13),0 0 14px rgba(239,77,88,.72);animation:offlinePulse 1.8s ease-in-out infinite}.offline .status-dot:after{border:1px solid rgba(239,77,88,.45);animation:ringPulseRed 1.8s ease-out infinite}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:13px 0}.metric{background:#fafbfd;border:1px solid #edf1f5;border-radius:9px;padding:8px}.metric label{display:block;font-size:7px;color:#8996a6;text-transform:uppercase;letter-spacing:.4px}.metric strong{display:block;font-size:10px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gain{color:var(--green)!important}.bar{height:5px;border-radius:99px;background:#edf2f7;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#1769e8,#69adff);border-radius:99px;transform-origin:left center;animation:barIn .7s cubic-bezier(.2,.8,.2,1)}.card{animation:cardIn .55s cubic-bezier(.2,.8,.2,1) both}.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}.card:nth-child(4){animation-delay:.12s}.card:nth-child(5){animation-delay:.16s}.card:nth-child(6){animation-delay:.2s}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid #edf1f5;color:#8a97a7;font-size:8px}.empty{background:#fff;border:1px dashed #cfdae7;border-radius:18px;padding:70px 20px;text-align:center;color:#8190a2}.empty svg{width:42px;color:#a7b8ca}.empty p{font-size:11px}.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes livePulse{0%,100%{transform:scale(.88);opacity:.85}50%{transform:scale(1.18);opacity:1}}@keyframes offlinePulse{0%,100%{transform:scale(.9);opacity:.8}50%{transform:scale(1.08);opacity:1}}@keyframes ringPulse{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.65);opacity:0}}@keyframes ringPulseRed{0%{transform:scale(.7);opacity:.75}100%{transform:scale(1.7);opacity:0}}@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes barIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.wrap{width:calc(100% - 20px);padding-top:10px}.nav{position:relative;top:0;height:62px;padding-left:11px}.brand b{font-size:13px}.nav-actions .btn span{display:none}.nav-actions .btn{width:38px;padding:0;justify-content:center}.hero{padding:25px 2px 15px}.hero h1{font-size:23px}.grid{grid-template-columns:1fr;gap:10px}.card{padding:13px;border-radius:15px}.metrics{margin:11px 0}.toolbar{margin-bottom:10px}.toolbar h2{font-size:12px}}
.restart-btn{width:34px;height:34px;border:1px solid #d9e8fb;background:#f4f8ff;color:#1769e8;border-radius:9px;display:grid;place-items:center;cursor:pointer;transition:.2s}.restart-btn:hover{transform:translateY(-1px);background:#eaf3ff}.restart-btn svg{width:15px}.restart-btn.loading svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.delete-btn{width:34px;height:34px;border:1px solid #f0d7da;background:#fff8f8;color:#d94b55;border-radius:9px;display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .2s ease,background .2s ease,border-color .2s ease}.delete-btn svg{width:15px}.delete-btn:hover{transform:translateY(-1px);background:#fff0f1;border-color:#efbfc4}.confirm-card{width:min(430px,100%);background:#fff;border-radius:20px;padding:20px;box-shadow:0 30px 90px rgba(18,53,91,.22);animation:confirmIn .22s ease both}.confirm-icon{width:46px;height:46px;border-radius:14px;background:#fff1f2;color:#d94b55;display:grid;place-items:center;margin-bottom:13px}.confirm-icon svg{width:21px}.confirm-title{font-size:15px;font-weight:900;margin:0 0 6px}.confirm-text{font-size:10px;line-height:1.6;color:#7b8999;margin:0}.confirm-name{color:var(--ink);font-weight:800}.confirm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.btn.danger{background:#d94b55;border-color:#d94b55;color:#fff}@keyframes confirmIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}@media(max-width:650px){.confirm-actions .btn{flex:1}}</style></head><body><div class="wrap"><header class="nav"><a class="brand" href="/" style="text-decoration:none;color:inherit"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12.5 8.5 17 20 5.5"/><path d="M4 5h6"/><path d="M4 19h6"/></svg></div><div><b>MAHIN MODZ</b><small>Live monitoring</small></div></a><div class="nav-actions"><button class="btn" onclick="load()"><span>Refresh</span></button><button class="btn" onclick="location.href='/'"><span>Home</span></button><button class="btn" onclick="location.href='/logout'"><span>Logout</span></button></div></header><section class="hero"><div class="eyebrow">Real-time control</div><h1>Live Accounts &amp; EXP Monitor</h1><p>Track every connected account, EXP progress, matches and current activity.</p></section><div class="toolbar"><h2 id="count">Accounts</h2><span id="sync">Syncing...</span></div><div id="grid" class="grid"></div></div><div class="modal" id="deleteModal" style="display:none;position:fixed;inset:0;background:rgba(13,35,61,.25);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:16px;z-index:30"><div class="confirm-card"><div class="confirm-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></div><h3 class="confirm-title">Delete account?</h3><p class="confirm-text">This will stop the account worker and remove <span class="confirm-name" id="deleteName">this account</span> from the saved account list.</p><div class="confirm-actions"><button class="btn" onclick="closeDelete()">Cancel</button><button class="btn danger" id="confirmDeleteBtn" onclick="confirmDelete()">Delete Account</button></div></div></div><script>
const ICON={restart:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11a8 8 0 0 0-14.7-4L3 10"/><path d="M3 5v5h5"/><path d="M4 13a8 8 0 0 0 14.7 4L21 14"/><path d="M21 19v-5h-5"/></svg>`,trash:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>`,user:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c.8-3.5 3.2-5.2 7-5.2s6.2 1.7 7 5.2"/></svg>`,refresh:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11a8 8 0 0 0-14.7-4L3 10"/><path d="M3 5v5h5"/><path d="M4 13a8 8 0 0 0 14.7 4L21 14"/><path d="M21 19v-5h-5"/></svg>`,home:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 11 9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>`,logout:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 5H5v14h5"/><path d="M14 8l4 4-4 4"/><path d="M9 12h9"/></svg>`};
document.querySelector('.logo').innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12.5 8.5 17 20 5.5"/><path d="M4 5h6"/><path d="M4 19h6"/></svg>`;document.querySelectorAll('.btn')[0].insertAdjacentHTML('afterbegin',ICON.refresh);document.querySelectorAll('.btn')[1].insertAdjacentHTML('afterbegin',ICON.home);document.querySelectorAll('.btn')[2].insertAdjacentHTML('afterbegin',ICON.logout);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(n){return Number(n||0).toLocaleString()}
function render(a){const gain=a.gained_exp||0;const raw=String(a.status||'OFFLINE').toUpperCase();const active=raw==='ONLINE'||raw==='IN_MATCH'||raw==='ACTIVE';const cls=raw==='IN_MATCH'?'match':(active?'online':'offline');const text=active?(raw==='IN_MATCH'?`In Match · ${a.active_matches||0} active`:'Active'):'Offline';const width=Math.min(100,Math.max(8,(Number(a.current_exp||0)%1000)/10));return `<article class="card" onclick="location.href='/account?uid=${encodeURIComponent(a.uid)}'"><div class="top"><div class="profile"><div class="avatar">${ICON.user}</div><div style="min-width:0"><div class="name">${esc(a.nickname)} <span class="badge">${esc(a.region||'BD')}</span></div><div class="uid">UID ${esc(a.uid)}</div></div></div><span class="status ${cls}"><i class="status-dot"></i><span>${text}</span></span></div><div class="metrics"><div class="metric"><label>Level</label><strong>${fmt(a.level)}</strong></div><div class="metric"><label>Current EXP</label><strong>${fmt(a.current_exp)}</strong></div><div class="metric"><label>Gained</label><strong class="gain">+${fmt(gain)}</strong></div></div><div class="bar"><div class="fill" style="width:${width}%"></div></div><div class="foot"><span>${fmt(a.matches_played)} matches</span><div style="display:flex;align-items:center;gap:8px"><button class="restart-btn" title="Restart account" aria-label="Restart account" onclick="event.stopPropagation();restartAccount('${esc(a.uid)}',this)">${ICON.restart}</button><button class="delete-btn" title="Delete account" aria-label="Delete account" onclick="event.stopPropagation();openDelete('${esc(a.uid)}','${esc(a.nickname)}')">${ICON.trash}</button><span>Updated ${esc(a.last_updated||'—')}</span></div></article>`}
async function restartAccount(uid,button){button.disabled=true;button.classList.add("loading");try{const r=await fetch("/api/account/restart",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({uid})});const d=await r.json().catch(()=>({}));if(!r.ok||d.status!=="ok")throw new Error(d.error||"Unable to restart account");load();}catch(e){alert(e.message)}finally{button.disabled=false;button.classList.remove("loading")}}
function openDelete(uid,name){window.deleteUid=uid;document.getElementById('deleteName').textContent=name||uid;const m=document.getElementById('deleteModal');m.style.display='flex';}
function closeDelete(){window.deleteUid='';document.getElementById('deleteModal').style.display='none';}
async function confirmDelete(){if(!window.deleteUid)return;const btn=document.getElementById('confirmDeleteBtn');btn.disabled=true;btn.textContent='Deleting...';try{const r=await fetch('/api/account/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid:window.deleteUid})});const d=await r.json().catch(()=>({}));if(!r.ok||d.status!=='ok')throw new Error(d.error||'Unable to delete account');closeDelete();load();}catch(e){alert(e.message);btn.disabled=false;btn.textContent='Delete Account';}}
async function load(){const g=document.getElementById('grid');try{const r=await fetch('/api/stats');if(r.status===401){location.href='/login';return}const d=await r.json();document.getElementById('count').textContent=`${d.accounts.length} ${d.accounts.length===1?'Account':'Accounts'}`;document.getElementById('sync').textContent='Live · auto sync 2.5s';g.innerHTML=d.accounts.length?d.accounts.map(render).join(''):`<div class="empty" style="grid-column:1/-1"><div>${ICON.user}</div><p>No active accounts are running.</p></div>`}catch(e){document.getElementById('sync').textContent='Connection unavailable'}}load();setInterval(load,2500);
</script></body></html>
