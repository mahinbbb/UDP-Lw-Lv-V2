<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Account Details | MAHIN MODZ</title><style>
:root{--blue:#1769e8;--ink:#10243d;--muted:#728196;--line:#e4ebf3;--soft:#f4f8ff;--green:#11966a;--shadow:0 18px 55px rgba(24,61,105,.08)}*{box-sizing:border-box}body{margin:0;background:#f6f9fd;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(1180px,calc(100% - 40px));margin:auto;padding:22px 0 40px}.nav{height:68px;background:#fff;border:1px solid var(--line);border-radius:18px;display:flex;align-items:center;justify-content:space-between;padding:9px 12px 9px 17px;box-shadow:0 8px 28px rgba(20,55,95,.05)}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}.logo{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--blue);display:grid;place-items:center}.logo svg{width:21px}.brand b{font-size:15px}.brand small{display:block;color:#8a97a8;font-size:9px;margin-top:2px}.nav-actions{display:flex;gap:7px}.btn{height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#52677e;padding:0 12px;display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:800;cursor:pointer}.btn svg{width:15px}.btn:hover{color:var(--blue);border-color:#c1d4eb}.main{padding-top:28px}.back{font-size:10px;color:var(--blue);font-weight:850;cursor:pointer}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:12px 0 18px}.profile{display:flex;gap:13px;align-items:center}.avatar{width:54px;height:54px;border-radius:15px;background:#edf5ff;color:var(--blue);display:grid;place-items:center}.avatar svg{width:25px}.eyebrow{font-size:8px;color:var(--blue);font-weight:900;letter-spacing:1px;text-transform:uppercase}.name{font-size:25px;font-weight:900;letter-spacing:-.8px;margin-top:4px}.uid{font:10px ui-monospace,SFMono-Regular,monospace;color:#8b98a8;margin-top:4px}.status{display:inline-flex;align-items:center;gap:8px;font-size:9px;font-weight:900;padding:7px 10px;border-radius:999px;border:1px solid transparent;transition:.25s}.status-dot{width:9px;height:9px;border-radius:50%;display:inline-block;position:relative}.status-dot:after{content:"";position:absolute;inset:-4px;border-radius:50%}.status.online{background:#effbf6;color:#087a52;border-color:#cdeee1}.status.online .status-dot{background:#18b77b;box-shadow:0 0 0 2px rgba(24,183,123,.14),0 0 15px rgba(24,183,123,.8);animation:livePulse 1.5s ease-in-out infinite}.status.online .status-dot:after{border:1px solid rgba(24,183,123,.45);animation:ringPulse 1.5s ease-out infinite}.status.offline{background:#fff1f2;color:#c73743;border-color:#ffd7db}.status.offline .status-dot{background:#ef4d58;box-shadow:0 0 0 2px rgba(239,77,88,.13),0 0 15px rgba(239,77,88,.8);animation:offlinePulse 1.8s ease-in-out infinite}.status.offline .status-dot:after{border:1px solid rgba(239,77,88,.45);animation:ringPulseRed 1.8s ease-out infinite}.status.match{background:#eef5ff;color:var(--blue);border-color:#d8e7fb}.status.match .status-dot{background:#2b7df0;box-shadow:0 0 0 2px rgba(43,125,240,.14),0 0 15px rgba(43,125,240,.75);animation:livePulse 1.4s ease-in-out infinite}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}.panel h3{font-size:12px;margin:0 0 14px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{border:1px solid #edf1f5;background:#fafbfd;border-radius:12px;padding:13px}.stat label{display:block;font-size:8px;color:#8a97a8;text-transform:uppercase;letter-spacing:.5px}.stat strong{display:block;font-size:16px;margin-top:6px}.blue{color:var(--blue)}.green{color:var(--green)}.bar{height:8px;border-radius:99px;background:#edf2f7;overflow:hidden;margin-top:8px}.fill{height:100%;background:linear-gradient(90deg,#1769e8,#6db0ff);border-radius:99px}.row{display:flex;justify-content:space-between;gap:15px;padding:11px 0;border-bottom:1px solid #edf1f5;font-size:10px}.row:last-child{border-bottom:0}.row span:first-child{color:#8491a2}.row span:last-child{font-weight:800;text-align:right}.log{font:9px/1.7 ui-monospace,SFMono-Regular,monospace;color:#58708b;padding:8px 0;border-bottom:1px solid #edf1f5}.log:last-child{border:0}.actions{display:flex;gap:8px;margin-top:14px}.danger{color:#d94b55}.empty{padding:30px;text-align:center;color:#8190a2;font-size:10px}@media(max-width:750px){.wrap{width:calc(100% - 20px);padding-top:10px}.nav{position:relative;height:62px}.nav-actions .btn span{display:none}.nav-actions .btn{width:38px;padding:0;justify-content:center}.main{padding-top:22px}.head{align-items:flex-start;flex-direction:column}.name{font-size:22px}.grid{grid-template-columns:1fr}.panel{padding:14px;border-radius:15px}.stats{grid-template-columns:repeat(2,1fr)}}
@keyframes livePulse{0%,100%{transform:scale(.88);opacity:.85}50%{transform:scale(1.18);opacity:1}}@keyframes offlinePulse{0%,100%{transform:scale(.9);opacity:.8}50%{transform:scale(1.08);opacity:1}}@keyframes ringPulse{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.65);opacity:0}}@keyframes ringPulseRed{0%{transform:scale(.7);opacity:.75}100%{transform:scale(1.7);opacity:0}}@keyframes pageIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}body{animation:pageIn .35s ease both}.panel{animation:pageIn .5s ease both}</style></head><body><div class="wrap"><header class="nav"><a class="brand" href="/"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12.5 8.5 17 20 5.5"/><path d="M4 5h6"/><path d="M4 19h6"/></svg></div><div><b>MAHIN MODZ</b><small>Account details</small></div></a><div class="nav-actions"><button class="btn" onclick="history.back()"><span>Back</span>Back</button><button class="btn" onclick="location.href='/monitor'"><span>Monitor</span>Monitor</button></div></header><main class="main"><div class="back" onclick="history.back()">← Back to accounts</div><div id="app"></div></main></div><script>
const uid=new URLSearchParams(location.search).get('uid');function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(n){return Number(n||0).toLocaleString()}function userSvg(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c.8-3.5 3.2-5.2 7-5.2s6.2 1.7 7 5.2"/></svg>`}async function load(){if(!uid){location.href='/monitor';return}const r=await fetch('/api/account?uid='+encodeURIComponent(uid));if(r.status===401){location.href='/login';return}if(!r.ok){document.getElementById('app').innerHTML='<div class="panel empty">Account not found.</div>';return}const d=await r.json(),a=d.account,g=a.gained_exp||0,w=Math.min(100,Math.max(8,(Number(a.current_exp||0)%1000)/10));document.getElementById('app').innerHTML=`const raw=String(a.status||'OFFLINE').toUpperCase();const active=raw==='ONLINE'||raw==='IN_MATCH'||raw==='ACTIVE';const statusClass=raw==='IN_MATCH'?'match':(active?'online':'offline');const statusText=active?(raw==='IN_MATCH'?'In Match':'Active'):'Offline';document.getElementById('app').innerHTML=`<div class="head"><div class="profile"><div class="avatar">${userSvg()}</div><div><div class="eyebrow">Account profile</div><div class="name">${esc(a.nickname)}</div><div class="uid">UID ${esc(a.uid)} · ${esc(a.region||'BD')}</div></div></div><div class="status ${statusClass}"><i class="status-dot"></i><span>${statusText}</span></div></div><div class="grid"><section class="panel"><h3>EXP Overview</h3><div class="stats"><div class="stat"><label>Level</label><strong class="blue">${fmt(a.level)}</strong></div><div class="stat"><label>EXP Gained</label><strong class="green">+${fmt(g)}</strong></div><div class="stat"><label>Current EXP</label><strong>${fmt(a.current_exp)}</strong></div><div class="stat"><label>Initial EXP</label><strong>${fmt(a.initial_exp)}</strong></div></div><div style="margin-top:18px"><div style="display:flex;justify-content:space-between;font-size:9px;color:#7e8c9e;font-weight:800"><span>Level ${fmt(a.level)}</span><span>${Math.round(w)}% progress</span></div><div class="bar"><div class="fill" style="width:${w}%"></div></div></div><div class="actions"><button class="btn" onclick="refresh()">Refresh Account</button><button class="btn danger" onclick="location.href='/monitor'">Back to Monitor</button></div></section><aside class="panel"><h3>Account Activity</h3><div class="row"><span>Status</span><span>${esc(a.status||'ONLINE')}</span></div><div class="row"><span>Matches Played</span><span>${fmt(a.matches_played)}</span></div><div class="row"><span>Active Matches</span><span>${fmt(a.active_matches)}</span></div><div class="row"><span>Last Match</span><span>${esc(a.last_match_time||'—')}</span></div><div class="row"><span>Last Updated</span><span>${esc(a.last_updated||'—')}</span></div><div class="row"><span>Likes</span><span>${fmt(a.likes)}</span></div></aside></div><section class="panel" style="margin-top:14px"><h3>Recent Activity</h3>${(d.logs||[]).length?d.logs.map(x=>`<div class="log">[${esc(x.time)}] ${esc(x.message)}</div>`).join(''):'<div class="empty">No activity recorded for this account.</div>'}</section>`}async function refresh(){await fetch('/api/account/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid})});load()}load();setInterval(load,2500);
</script></body></html>
